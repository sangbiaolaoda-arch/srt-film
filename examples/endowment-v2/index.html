<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>禀赋效应 · 叙事短片（v2）</title>
<style>
  html, body { margin: 0; height: 100%; background: #05080f; overflow: hidden; }
  #stage {
    position: absolute; inset: 0; width: 100%; height: 100%;
    display: block; background: #05080f;
  }
</style>
<!-- gsap 以 UMD 全局方式加载，供 app.js（ES module）取 window.gsap 使用 -->
<script src="./lib/gsap.min.js"></script>
</head>
<body>
  <svg id="stage" viewBox="0 0 1280 720" width="1280" height="720" preserveAspectRatio="xMidYMid meet">
    <!-- 背景层（安静负空间 + 单一锚点 + 暗角） -->
    <g id="bgLayer"></g>
    <!-- 机位层（有意图运动作用于此） -->
    <g id="camera">
      <g id="illuLayer"></g>
    </g>
    <!-- UI 层：字幕 + 进度（按时间求值，seek 安全） -->
    <g id="uiLayer">
      <rect id="capBg" x="500" y="624" width="280" height="56" rx="14"
            fill="#0E1525" opacity="0.82" stroke="#2E3E5C" stroke-width="1"/>
      <text id="caption" x="640" y="660"
            font-family="Microsoft YaHei, Noto Sans SC, PingFang SC, sans-serif"
            font-size="30" font-weight="600" fill="#EEF3FB" text-anchor="middle" opacity="0">字幕</text>
      <rect id="progress" x="0" y="712" width="0" height="8" fill="#FFB454"/>
    </g>
  </svg>

  <script type="module" src="./src/app.js"></script>
</body>
</html>
