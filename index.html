<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>srt-film — 字幕变电影</title>
</head>
<body>
  <div id="app">
    <header class="masthead">
      <h1>srt-film</h1>
      <p class="tagline">贴入字幕，得到一部逐拍演出的片子。画面里的每个数字都可溯源。</p>
    </header>

    <main class="workspace">
      <section class="pane pane-input">
        <label class="field">
          <span class="field-label">字幕（SRT）</span>
          <textarea id="srt-input" rows="14" spellcheck="false"
            placeholder="1&#10;00:00:00,000 --> 00:00:02,000&#10;第一句话。"></textarea>
        </label>
        <label class="field">
          <span class="field-label">导演覆写（JSON，可选）— key 为拍序号</span>
          <textarea id="override-input" rows="6" spellcheck="false"
            placeholder='{ "2": { "bigNumber": "120毫秒", "source": "耗时120毫秒" } }'></textarea>
        </label>
        <div class="export-settings">
          <span class="field-label">导出设置</span>
          <label class="field-inline">
            <span>分辨率</span>
            <select id="export-res"></select>
          </label>
          <label class="field-inline">
            <span>帧率</span>
            <select id="export-fps"></select>
          </label>
          <label class="field-inline">
            <span>码率</span>
            <select id="export-bitrate"></select>
          </label>
          <span id="export-summary" class="export-summary"></span>
        </div>
        <div class="actions">
          <button id="btn-load" class="btn btn-primary">载入并规划</button>
          <label class="btn file-btn">选择 .srt 文件
            <input id="srt-file" type="file" accept=".srt,text/plain" hidden />
          </label>
          <button id="btn-play" class="btn" disabled>播放</button>
          <button id="btn-export" class="btn" disabled>导出 MP4</button>
          <button id="btn-cancel" class="btn" hidden disabled>取消导出</button>
          <button id="btn-save" class="btn" disabled>保存工程 JSON</button>
        </div>
        <ol id="status-steps" class="status-steps">
          <li data-step="read">读取</li>
          <li data-step="analyze">分析</li>
          <li data-step="plan">规划</li>
          <li data-step="preview">预览</li>
          <li data-step="export">导出</li>
          <li data-step="verify">验收</li>
        </ol>
        <div id="status-log" class="status-log" hidden></div>
        <ul id="gate-report" class="gate-report" hidden></ul>
      </section>

      <section class="pane pane-stage">
        <div id="stage" class="stage">
          <div class="stage-empty">片子会在这里逐拍演出</div>
        </div>
        <div class="transport">
          <input id="scrubber" type="range" min="0" max="1000" value="0" disabled />
          <span id="timecode">00:00.0</span>
        </div>
        <ol id="beat-list" class="beat-list"></ol>
      </section>
    </main>
  </div>
  <script type="module" src="/src/ui/main.ts"></script>
</body>
</html>
